org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Versión publicada. scripts/publish-release.sh exige subir versionCode en cada publicación.
soyvinko.versionCode=36
soyvinko.versionName=1.3.32
# Kotlin Multiplatform: compila las librerías de iOS también en Linux; el enlace final lo hace macOS (ios-builder).
kotlin.native.enableKlibsCrossCompilation=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
