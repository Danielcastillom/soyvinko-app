org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Versión publicada. scripts/publish-release.sh exige subir versionCode en cada publicación.
soyvinko.versionCode=3
soyvinko.versionName=1.2.0
# Kotlin Multiplatform: compila las librerías de iOS también en Linux; el enlace final lo hace macOS (ios-builder).
kotlin.native.enableKlibsCrossCompilation=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true
