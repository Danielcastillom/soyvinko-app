name: chamba
services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chamba}
      POSTGRES_USER: ${POSTGRES_USER:-chamba_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta python3 scripts/db.py init}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - chamba_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
  api:
    user: "${LOCAL_UID:-1001}:${LOCAL_GID:-1001}"
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DATA_DIR: /app/data
    extra_hosts:
      - "soyvinko.com:host-gateway"
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
  worker:
    user: "${LOCAL_UID:-1001}:${LOCAL_GID:-1001}"
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DATA_DIR: /app/data
    extra_hosts:
      - "soyvinko.com:host-gateway"
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./backend/data:/app/data
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
volumes:
  chamba_data:
