# Do not record query strings, cookies, authorization headers or referrers.
log_format contrata_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name contrata.contupana.pro;
    access_log /var/log/nginx/contrata.contupana.pro.access.log contrata_safe;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://contrata.contupana.pro$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name contrata.contupana.pro;

    ssl_certificate /home/davebas/.config/letsencrypt-contrata/live/contrata.contupana.pro/fullchain.pem;
    ssl_certificate_key /home/davebas/.config/letsencrypt-contrata/live/contrata.contupana.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_stapling off;

    client_max_body_size 11m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    # Portal de PRUEBA con cuentas ficticias: no debe indexarse.
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace client-supplied forwarding headers at this public boundary.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Robots-Tag;

    # API routes must never fall back to the SPA's index.html.
    location /api/ {
        proxy_pass http://127.0.0.1:8181;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8180;
    }

    access_log /var/log/nginx/contrata.contupana.pro.access.log contrata_safe;
    error_log /var/log/nginx/contrata.contupana.pro.error.log warn;
}
